<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transparent background: no rect fill -->
  
  <!-- Left Ear -->
  <circle cx="26" cy="28" r="18" fill="#eab308" stroke="#0f172a" stroke-width="4.5"/>
  <circle cx="26" cy="28" r="11" fill="#fde047"/>

  <!-- Right Ear -->
  <circle cx="74" cy="28" r="18" fill="#eab308" stroke="#0f172a" stroke-width="4.5"/>
  <circle cx="74" cy="28" r="11" fill="#fde047"/>

  <!-- Rat Head Base -->
  <path d="M 22,50 C 18,36 34,24 50,24 C 66,24 82,36 78,50 C 75,65 64,84 50,84 C 36,84 25,65 22,50 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Snout / Muzzle -->
  <ellipse cx="50" cy="67" rx="16" ry="12" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Left Eye -->
  <circle cx="37" cy="46" r="5" fill="#0f172a"/>
  <circle cx="36" cy="44" r="1.5" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="63" cy="46" r="5" fill="#0f172a"/>
  <circle cx="62" cy="44" r="1.5" fill="#ffffff"/>

  <!-- Pink Nose -->
  <path d="M 45,62 C 45,62 50,58 55,62 C 55,62 50,68 45,62 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Mouth -->
  <path d="M 50,65 L 50,70 Q 44,73 42,70 M 50,70 Q 56,73 58,70" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Whiskers -->
  <line x1="30" y1="63" x2="12" y2="60" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="67" x2="12" y2="69" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Whiskers -->
  <line x1="70" y1="63" x2="88" y2="60" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="67" x2="88" y2="69" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
</svg>
